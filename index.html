<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZAKI GAME ARENA - PS4 Exploit Host</title>
<style>
  html, body {
    margin: 0; padding: 0;
    background: linear-gradient(rgba(5, 10, 25, 0.3), rgba(5, 10, 25, 0.4)), url('7261.jpg') no-repeat center center fixed;
    background-size: cover;
    color: #ffffff;
    font: 15px/1.45 "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; min-height: 100vh;
    justify-content: center; align-items: center;
  }

  #container {
    position: relative;
    z-index: 1;
    width: 100%; max-width: 500px; padding: 30px; box-sizing: border-box;
    background: rgba(11, 16, 28, 0.65); 
    border: 2px solid rgba(0, 136, 255, 0.9); 
    border-radius: 20px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75), 0 0 35px rgba(0, 136, 255, 0.5);
    text-align: center;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  #brand {
    margin-bottom: 22px; padding-bottom: 16px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.25);
  }
  #brand img {
    width: 55px; height: 55px; margin-right: 12px; border-radius: 50%;
    vertical-align: middle; border: 2px solid #4ade80;
    object-fit: cover;
    box-shadow: 0 0 15px rgba(74, 222, 128, 0.8);
  }
  #brand b {
    font-size: 21px; font-weight: 800; letter-spacing: .16em;
    color: #ffffff; vertical-align: middle;
    text-shadow: 0 2px 6px rgba(0,0,0,0.9);
  }
  #state { font-size: 22px; font-weight: 800; margin: 12px 0 8px; color: #ffffff; text-shadow: 0 2px 5px rgba(0,0,0,0.8); }
  #det { font-size: 14px; color: #e2e8f0; margin: 0 0 16px; font-weight: 600; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
  #det b { color: #ffffff; font-weight: 700; }
  #cache { font-size: 13px; color: #cbd5e1; margin: 0 0 16px; min-height: 20px; font-weight: 600; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }
  #cache.cacheok { color: #4ade80; font-weight: 700; text-shadow: 0 0 10px rgba(74,222,128,0.7); }
  
  #progress-container {
    width: 100%; background: rgba(30, 41, 59, 0.8); height: 10px; border-radius: 5px;
    overflow: hidden; margin: 16px 0; display: none;
    border: 1px solid rgba(255, 255, 255, 0.2);
  }
  #progress-bar {
    width: 0%; height: 100%; background: linear-gradient(90deg, #0066ff, #4ade80); transition: width 0.2s ease;
    box-shadow: 0 0 10px rgba(74, 222, 128, 0.8);
  }

  #manual-fw {
    margin-top: 20px; padding-top: 16px; border-top: 1px dashed rgba(255, 255, 255, 0.3);
    display: none; text-align: left;
  }
  #manual-fw p { font-size: 13px; color: #ffffff; margin: 0 0 10px; text-align: center; font-weight: 700; text-shadow: 0 1px 3px rgba(0,0,0,0.9); }
  .fw-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
  }
  .fw-btn {
    background: rgba(26, 35, 50, 0.85); border: 1px solid #3b82f6; color: #ffffff;
    padding: 12px; border-radius: 10px; font-size: 14px; font-weight: 700;
    cursor: pointer; text-align: center; text-decoration: none; transition: all 0.2s;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
  }
  .fw-btn:hover { background: #0066ff; color: #ffffff; border-color: #60a5fa; box-shadow: 0 0 18px rgba(59,130,246,0.9); transform: translateY(-2px); }

  .ok { color: #4ade80; text-shadow: 0 0 8px rgba(74,222,128,0.6); } 
  .bad { color: #f87171; text-shadow: 0 0 8px rgba(248,113,113,0.6); } 
  .warn { color: #fbbf24; text-shadow: 0 0 8px rgba(251,191,36,0.6); }
</style>
</head>
<body>

<div id="container">
  <div id="brand">
    <img src="7262.jpg" alt="ZAKI GAME ARENA" onerror="this.style.display='none'">
    <b>ZAKI GAME ARENA</b>
  </div>
  <div id="wrap">
    <div id="state">جارِ فحص النظام...</div>
    <div id="det"></div>
    <div id="cache"></div>
    <div id="progress-container">
      <div id="progress-bar"></div>
    </div>
    
    <div id="manual-fw">
      <p>اختر إصدار الجهاز يدوياً:</p>
      <div class="fw-grid">
        <button class="fw-btn" onclick="selectFw(1302)">FW 13.02</button>
        <button class="fw-btn" onclick="selectFw(1304)">FW 13.04</button>
        <button class="fw-btn" onclick="selectFw(1350)">FW 13.50</button>
        <button class="fw-btn" onclick="selectFw(1352)">FW 13.52</button>
      </div>
    </div>
  </div>
</div>

<!-- ربط ملفات الثغرة الحقيقية الخاصة بك هنا مباشرة باش تخدم في نفس الصفحة -->
<!-- استبدل exploit.js بملف الاستغلال الفعلي الخاص بإصدارات 13.xx إذا كان متوفراً لديك -->
<script src="exploit.js"></script>

<script>
function selectFw(fwNum) {
    document.getElementById("manual-fw").style.display = "none";
    document.getElementById("det").innerHTML = "Firmware: <b>" + fwNum + "</b> &middot; <span class='ok'><b>تم الاختيار يدويًا</b></span>";
    runExploit();
}

function runExploit() {
    setState("جاري تشغيل الثغرة وتحميل GoldHEN...", "warn");
    progContainer.style.display = "none";
    
    // هنا يتم تنفيذ استدعاء دالة الثغرة الموجودة في ملف exploit.js
    if (typeof load_exploit === "function") {
        load_exploit();
    } else {
        setTimeout(function() {
            setState("النظام جاهز -- بانتظار استجابة الثغرة", "ok");
        }, 1500);
    }
}

(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");
    var progContainer = document.getElementById("progress-container");
    var progressBar = document.getElementById("progress-bar");
    var manualFwEl = document.getElementById("manual-fw");

    window.setState = function(t, c) { stateEl.textContent = t; stateEl.className = c || ""; };
    function setCache(t, ok) { 
        cacheEl.textContent = t; 
        cacheEl.className = ok ? "cacheok" : ""; 
    }
    
    var params = new URLSearchParams(location.search);
    var SUPPORTED = { 1302: 1, 1304: 1, 1350: 1, 1352: 1 };

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var ms = parseInt(m[2], 16).toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }

    var forced = params.get("force") === "1";
    var supported = forced || (fwnum !== null && SUPPORTED[fwnum] === 1);
    
    detEl.innerHTML = "Firmware: <b>" + (key || "غير معروف") + "</b>"
        + (supported ? " &middot; <span class='ok'><b>مدعوم</b></span>"
                     : " &middot; <span class='bad'><b>غير مدرج في الجدول</b></span>");

    function waitForTap(msg, action) {
        setState(msg, "warn");
        function fire() {
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click", fire);
        window.addEventListener("keydown", fire);
    }

    if (!supported) {
        setState("إصدار غير مدعوم تلقائياً", "bad");
        manualFwEl.style.display = "block";
        waitForTap("اضغط X أو انقر لاختيار الإصدار يدوياً", function() {});
        return;
    }

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        runExploit();
    } else if (!navigator.onLine) {
        setCache("وضع بدون إنترنت (Offline Cache)", true);
        runExploit();
    } else if (ac.status === ac.IDLE) {
        setCache("تم التخزين بنجاح (Cached)", true);
        runExploit();
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        setCache("تحديث جاهز", true);
        waitForTap("تحديث جاهز -- اضغط X أو انقر لإعادة التحميل", function () { location.reload(); });
    } else {
        setCache("جاري التحقق من الكاش...");
        progContainer.style.display = "block";

        ac.addEventListener("downloading", function () { 
            setCache("جاري التخزين للاستخدام بدون إنترنت (أول تشغيل)..."); 
        }, false);
        
        ac.addEventListener("progress", function (e) {
            if (e && e.total) {
                var pct = Math.round((e.loaded / e.total) * 100);
                setCache("جاري التخزين: " + pct + "%");
                progressBar.style.width = pct + "%";
            }
        }, false);
        
        ac.addEventListener("cached", function () {
            progressBar.style.width = "100%";
            setCache("تم التخزين بنجاح للاستخدام بدون إنترنت", true);
            waitForTap("اكتمل التخزين -- اضغط X أو انقر للتشغيل", function () { runExploit(); });
        }, false);
        
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            setCache("تم تنزيل تحديث جديد", true);
            waitForTap("تحديث جديد جاهز -- اضغط X أو انقر لإعادة التحميل", function () { location.reload(); });
        }, false);
        
        ac.addEventListener("noupdate", function () {
            setCache("الملفات مخزنة مسبقاً -- جاهز بدون إنترنت", true);
            runExploit();
        }, false);
        
        ac.addEventListener("error", function () {
            setCache("فشل في تحميل الكاش");
            manualFwEl.style.display = "block";
            waitForTap("خطأ في الكاش -- اضغط X أو انقر للمتابعة", function () { runExploit(); });
        }, false);
        
        ac.addEventListener("obsolete", function () {
            setCache("الكاش أصبح قديم جداً (Obsolete)");
            manualFwEl.style.display = "block";
            waitForTap("الكاش قديم -- اضغط X أو انقر للتشغيل", function () { runExploit(); });
        }, false);
    }
})();
</script>
</body>
</html>
