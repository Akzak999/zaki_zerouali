<script>
// دالة الاختيار اليدوي للإصدار مع البقاء في نفس الصفحة
function selectFw(fwKey, fwNum) {
    document.getElementById("manual-fw").style.display = "none";
    document.getElementById("det").innerHTML = "Firmware: <b>" + fwKey + "</b> &middot; <span class='ok'><b>تم الاختيار يدويًا</b></span>";
    document.getElementById("state").textContent = "النظام جاهز في نفس الصفحة";
    document.getElementById("state").className = "ok";
    // مكان تنفيذ السكريبت الخاص بالثغرة مباشرة هنا إذا لزم الأمر
}

(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");
    var progContainer = document.getElementById("progress-container");
    var progressBar = document.getElementById("progress-bar");
    var manualFwEl = document.getElementById("manual-fw");

    function setState(t, c) { stateEl.textContent = t; stateEl.className = c || ""; }
    function setCache(t, ok) { 
        cacheEl.textContent = t; 
        cacheEl.className = ok ? "cacheok" : ""; 
    }
    
    var params = new URLSearchParams(location.search);
    var SUPPORTED = { 1302: 1, 1304: 1, 1350: 1, 1352: 1 };

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var ms = parseInt(m[2], 16).toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }

    var forced = params.get("force") === "1";
    var supported = forced || (fwnum !== null && SUPPORTED[fwnum] === 1);
    
    detEl.innerHTML = "Firmware: <b>" + (key || "غير معروف") + "</b>"
        + (supported ? " &middot; <span class='ok'><b>مدعوم</b></span>"
                     : " &middot; <span class='bad'><b>غير مدرج في الجدول</b></span>");

    // وظيفة التنفيذ المباشر في نفس الصفحة بدون أي انتقال
    function go() { 
        setState("النظام جاهز ومستقر -- يتم تشغيل الثغرة هنا...", "ok");
        progContainer.style.display = "none";
        // تقدر تحط أكواد الاستغلال والتشغيل هنا مباشرة دون مغادرة الصفحة
    }

    function waitForTap(msg, action) {
        setState(msg, "warn");
        function fire() {
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click", fire);
        window.addEventListener("keydown", fire);
    }

    if (!supported) {
        setState("إصدار غير مدعوم تلقائياً", "bad");
        manualFwEl.style.display = "block";
        waitForTap("اضغط X أو انقر لاختيار الإصدار يدوياً", function() {});
        return;
    }

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        go();
    } else if (!navigator.onLine) {
        setCache("وضع بدون إنترنت (Offline Cache)", true);
        go();
    } else if (ac.status === ac.IDLE) {
        setCache("تم التخزين بنجاح (Cached)", true);
        go();
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        setCache("تحديث جاهز", true);
        waitForTap("تحديث جاهز -- اضغط X أو انقر لتثبيت التحديث", function () { location.reload(); });
    } else {
        setCache("جاري التحقق من الكاش...");
        progContainer.style.display = "block";

        ac.addEventListener("downloading", function () { 
            setCache("جاري التخزين للاستخدام بدون إنترنت (أول تشغيل)..."); 
        }, false);
        
        ac.addEventListener("progress", function (e) {
            if (e && e.total) {
                var pct = Math.round((e.loaded / e.total) * 100);
                setCache("جاري التخزين: " + pct + "%");
                progressBar.style.width = pct + "%";
            }
        }, false);
        
        ac.addEventListener("cached", function () {
            progressBar.style.width = "100%";
            setCache("تم التخزين بنجاح للاستخدام بدون إنترنت", true);
            waitForTap("اكتمل التخزين -- اضغط X أو انقر للتشغيل", go);
        }, false);
        
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            setCache("تم تنزيل تحديث جديد", true);
            waitForTap("تحديث جديد جاهز -- اضغط X أو انقر لإعادة التحميل", function () { location.reload(); });
        }, false);
        
        ac.addEventListener("noupdate", function () {
            setCache("الملفات مخزنة مسبقاً -- جاهز بدون إنترنت", true);
            go();
        }, false);
        
        ac.addEventListener("error", function () {
            setCache("فشل في تحميل الكاش");
            manualFwEl.style.display = "block";
            waitForTap("خطأ في الكاش -- اضغط X أو انقر للمتابعة", go);
        }, false);
        
        ac.addEventListener("obsolete", function () {
            setCache("الكاش أصبح قديم جداً (Obsolete)");
            manualFwEl.style.display = "block";
            waitForTap("الكاش قديم -- اضغط X أو انقر للتشغيل", go);
        }, false);
    }
})();
</script>
