<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZAKI GAME ARENA - PS4 Exploit Host</title>
<style>
  html, body {
    margin: 0; padding: 0;
    /* الخلفية واضحة جداً وتظهر صورة الخلفية bg.jpg أو 7261.jpg */
    background: linear-gradient(rgba(5, 10, 25, 0.3), rgba(5, 10, 25, 0.4)), url('bg.jpg') no-repeat center center fixed;
    background-size: cover;
    color: #ffffff;
    font: 15px/1.45 "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; min-height: 100vh;
    justify-content: center; align-items: center;
  }

  #container {
    position: relative;
    z-index: 1;
    width: 100%; max-width: 500px; padding: 30px; box-sizing: border-box;
    background: rgba(11, 16, 28, 0.70); 
    border: 2px solid rgba(0, 136, 255, 0.9); 
    border-radius: 20px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 35px rgba(0, 136, 255, 0.5);
    text-align: center;
    backdrop-filter: blur(10px);
  }
  #brand {
    margin-bottom: 22px; padding-bottom: 16px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.25);
  }
  #brand img {
    width: 55px; height: 55px; margin-right: 12px; border-radius: 50%;
    vertical-align: middle; border: 2px solid #4ade80;
    object-fit: cover;
    box-shadow: 0 0 15px rgba(74, 222, 128, 0.8);
  }
  #brand b {
    font-size: 21px; font-weight: 800; letter-spacing: .16em;
    color: #ffffff; vertical-align: middle;
  }
  #state { font-size: 22px; font-weight: 800; margin: 12px 0 8px; color: #ffffff; }
  #det { font-size: 14px; color: #e2e8f0; margin: 0 0 16px; font-weight: 600; }
  #cache { font-size: 13px; color: #cbd5e1; margin: 0 0 16px; min-height: 20px; font-weight: 600; }
  #cache.cacheok { color: #4ade80; font-weight: 700; }
  
  #progress-container {
    width: 100%; background: rgba(30, 41, 59, 0.8); height: 10px; border-radius: 5px;
    overflow: hidden; margin: 16px 0; display: none;
    border: 1px solid rgba(255, 255, 255, 0.2);
  }
  #progress-bar {
    width: 0%; height: 100%; background: linear-gradient(90deg, #0066ff, #4ade80); transition: width 0.2s ease;
  }

  #manual-fw {
    margin-top: 20px; padding-top: 16px; border-top: 1px dashed rgba(255, 255, 255, 0.3);
    display: none; text-align: left;
  }
  #manual-fw p { font-size: 13px; color: #ffffff; margin: 0 0 10px; text-align: center; font-weight: 700; }
  .fw-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
  }
  .fw-btn {
    background: rgba(26, 35, 50, 0.85); border: 1px solid #3b82f6; color: #ffffff;
    padding: 12px; border-radius: 10px; font-size: 14px; font-weight: 700;
    cursor: pointer; text-align: center; text-decoration: none; transition: all 0.2s;
  }
  .fw-btn:hover { background: #0066ff; color: #ffffff; border-color: #60a5fa; box-shadow: 0 0 18px rgba(59,130,246,0.9); }

  .ok { color: #4ade80; } 
  .bad { color: #f87171; } 
  .warn { color: #fbbf24; }
</style>
</head>
<body>

<div id="container">
  <div id="brand">
    <!-- صورتك الشخصية 7262.jpg أو أيقونة المحل -->
    <img src="7262.jpg" alt="ZAKI GAME ARENA" onerror="this.style.display='none'">
    <b>ZAKI GAME ARENA</b>
  </div>
  <div id="wrap">
    <div id="state">جاري فحص النظام...</div>
    <div id="det"></div>
    <div id="cache"></div>
    <div id="progress-container">
      <div id="progress-bar"></div>
    </div>
    
    <div id="manual-fw">
      <p>اختر إصدار الجهاز يدوياً:</p>
      <div class="fw-grid">
        <a href="jb.html?fw=1302" class="fw-btn">FW 13.02</a>
        <a href="jb.html?fw=1304" class="fw-btn">FW 13.04</a>
        <a href="jb.html?fw=1350" class="fw-btn">FW 13.50</a>
        <a href="jb.html?fw=1352" class="fw-btn">FW 13.52</a>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");
    var progContainer = document.getElementById("progress-container");
    var progressBar = document.getElementById("progress-bar");
    var manualFwEl = document.getElementById("manual-fw");

    function setState(t, c) { stateEl.textContent = t; stateEl.className = c || ""; }
    function setCache(t, ok) { 
        cacheEl.textContent = t; 
        cacheEl.className = ok ? "cacheok" : ""; 
    }
    
    var params = new URLSearchParams(location.search);
    var SUPPORTED = { 1302: 1, 1304: 1, 1350: 1, 1352: 1 };

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var ms = parseInt(m[2], 16).toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }

    var forced = params.get("force") === "1";
    var supported = forced || (fwnum !== null && SUPPORTED[fwnum] === 1);
    
    detEl.innerHTML = "Firmware: <b>" + (key || "غير معروف") + "</b>"
        + (supported ? " &middot; <span class='ok'><b>مدعوم</b></span>"
                     : " &middot; <span class='bad'><b>غير مدرج</b></span>");

    var target = "jb.html" + location.search;
    function go() { 
        setState("جاري تشغيل الثغرة وحقن GoldHEN...", "warn");
        setTimeout(function() { location.replace(target); }, 800);
    }

    function waitForTap(msg, action) {
        setState(msg, "warn");
        function fire() {
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click", fire);
        window.addEventListener("keydown", fire);
    }

    if (!supported) {
        setState("إصدار غير مدعوم تلقائياً", "bad");
        manualFwEl.style.display = "block";
        waitForTap("اضغط X أو انقر للتشغيل اليدوي", go);
        return;
    }

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        go();
    } else if (!navigator.onLine) {
        setCache("وضع بدون إنترنت (Offline Cache)", true);
        go();
    } else if (ac.status === ac.IDLE) {
        setCache("تم التخزين بنجاح (Cached)", true);
        go();
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        setCache("تحديث جاهز", true);
        waitForTap("تحديث جاهز -- اضغط X للإعادة", function () { location.reload(); });
    } else {
        setCache("جاري التحقق من الكاش...");
        progContainer.style.display = "block";

        ac.addEventListener("downloading", function () { 
            setCache("جاري تخزين الملفات للاستخدام أوفلاين..."); 
        }, false);
        
        ac.addEventListener("progress", function (e) {
            if (e && e.total) {
                var pct = Math.round((e.loaded / e.total) * 100);
                setCache("جاري التخزين: " + pct + "%");
                progressBar.style.width = pct + "%";
            }
        }, false);
        
        ac.addEventListener("cached", function () {
            progressBar.style.width = "100%";
            setCache("تم التخزين بنجاح للاستخدام بدون إنترنت", true);
            waitForTap("اكتمل التخزين -- اضغط X أو انقر للبدء", go);
        }, false);
        
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            setCache("تحديث جديد جاهز", true);
            waitForTap("اضغط X لتحديث التشغيل", function () { location.reload(); });
        }, false);
        
        ac.addEventListener("noupdate", function () {
            setCache("الملفات مخزنة -- جاهز بدون إنترنت", true);
            go();
        }, false);
        
        ac.addEventListener("error", function () {
            setCache("فشل في تحميل الكاش");
            manualFwEl.style.display = "block";
            waitForTap("خطأ في الكاش -- اضغط للمتابعة", go);
        }, false);
        
        ac.addEventListener("obsolete", function () {
            setCache("الكاش قديم جداً");
            manualFwEl.style.display = "block";
            waitForTap("اضغط للتشغيل", go);
        }, false);
    }
})();
</script>
</body>
</html>
