<!doctype html>
<html lang="en" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ZAKI GAME ARENA - Exploit Runner</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        /* الخلفية bg.jpg واضحة ومثبتة بـ cover مع طبقة تعتيم خفيفة لجمالية الرؤية */
        background: linear-gradient(rgba(7, 11, 20, 0.45), rgba(7, 11, 20, 0.6)), url('bg.jpg') no-repeat center center fixed;
        background-size: cover;
        color: #e2e8f0;
        font: 15px/1.45 "Segoe UI", system-ui, sans-serif;
        display: flex;
        flex-direction: column;
      }
      #brand {
        text-align: center;
        padding: 12px 16px;
        background: rgba(13, 18, 28, 0.8);
        border-bottom: 2px solid rgba(0, 136, 255, 0.8);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }
      #brand b {
        font-size: 18px;
        font-weight: 800;
        letter-spacing: 0.16em;
        color: #ffffff;
        text-shadow: 0 2px 5px rgba(0,0,0,0.9);
      }

      /* running: a spinner under the brand. jb.js sets body.done / body.fail / body.log. */
      #spin {
        position: fixed;
        top: calc(50% + 20px);
        left: 50%;
        width: 50px;
        height: 50px;
        margin: -25px 0 0 -25px;
        border: 5px solid rgba(255, 255, 255, 0.15);
        border-top-color: #4ade80;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
        box-shadow: 0 0 15px rgba(74, 222, 128, 0.5);
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #msg {
        position: fixed;
        top: 50%;
        left: 0;
        right: 0;
        transform: translateY(-50%);
        text-align: center;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.5px;
        display: none;
        text-shadow: 0 2px 5px rgba(0,0,0,0.9);
      }
      #wrap {
        padding: 0;
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      #state,
      #out {
        display: none;
      }

      body.done #spin {
        display: none;
      }
      body.fail #spin {
        display: none;
      }
      body.fail #msg {
        display: block;
        color: #f87171;
      }
      body.done #msg {
        display: block;
        color: #4ade80;
        font-weight: 800;
        letter-spacing: 2px;
        text-shadow: 0 0 15px rgba(74, 222, 128, 0.8);
      }

      /* ?log=1 -- the full step log, styled with glassmorphism. */
      body.log #spin,
      body.log #msg {
        display: none;
      }
      body.log #wrap {
        padding: 20px;
      }
      body.log #state {
        display: block;
        font-size: 22px;
        font-weight: 800;
        margin: 0 0 10px;
        color: #ffffff;
        text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      }
      body.log #out {
        display: block;
        white-space: pre-wrap;
        font: 13px/1.45 Consolas, monospace;
        background: rgba(13, 18, 28, 0.85);
        border: 1px solid rgba(0, 136, 255, 0.6);
        border-radius: 12px;
        padding: 14px;
        height: calc(100vh - 150px);
        overflow-y: auto;
        backdrop-filter: blur(10px);
        box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      }
      .ok {
        color: #4ade80;
      }
      .bad {
        color: #f87171;
      }
      .warn {
        color: #fbbf24;
      }
      .safe {
        color: #4ade80;
      }
      .danger {
        color: #f87171;
      }
      code {
        color: #93c5fd;
      }
    </style>
  </head>
  <body>
    <div id="brand">
      <b>ZAKI GAME ARENA</b>
    </div>
    <div id="spin"></div>
    <div id="msg">أعد تشغيل الجهاز (Restart Console)</div>
    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>
    <script type="module">
      import "./jb.js?v=19";
    </script>
  </body>
</html>
